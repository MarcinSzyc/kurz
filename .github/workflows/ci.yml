name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Kurz is a macOS app: the core links AppKit and Foundation.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Type-checks and builds the UI; Rust embeds dist/, so this comes before cargo.
      - name: Build UI
        run: pnpm build

      - name: UI tests
        run: pnpm test

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
